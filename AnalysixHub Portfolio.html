<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnalysixHub | Data Analyst</title>
<meta name="description" content="Welcome to AnalysixHub, a professional data analytics portfolio showcasing projects, dashboards, insights, and practical solutions built with data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style id="baseStyle">
:root{--bg:#000;--s1:#080D18;--s2:#0E1626;--line:#1A2540;--tx:#EAF0FF;--mu:#92A0BF;--blue:#2F7BFF;--blue2:color-mix(in srgb,var(--blue) 62%,#fff);--ok:#35C98A;--warn:#F2B13C;--bad:#FF6573;--disp:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"Figtree","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--tx);font:400 1rem/1.65 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--disp);margin:0;line-height:1.1;letter-spacing:-.015em}
p{margin:0 0 1em}
a{color:var(--blue2)}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--blue2);outline-offset:3px;border-radius:4px}
.wrap{width:100%;max-width:none;margin:0 auto;padding:0 clamp(16px,5vw,96px)}
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:9px;border:1px solid var(--blue);background:var(--blue);color:#fff;font:600 .98rem var(--body);text-decoration:none;cursor:pointer;transition:background .2s,border-color .2s}
.btn:hover{background:color-mix(in srgb,var(--blue) 82%,#fff);border-color:color-mix(in srgb,var(--blue) 82%,#fff)}
.btn.ghost{background:transparent;color:var(--tx);border-color:#2A3A5E}
.btn.ghost:hover{border-color:var(--blue2);background:rgba(47,123,255,.08)}
.btn.sm{padding:8px 14px;font-size:.88rem;border-radius:8px}
.btn.danger{background:transparent;border-color:#5a2630;color:var(--bad)}
.btn.danger:hover{background:rgba(255,101,115,.1)}

/* public nav */
.nav{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:66px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font:800 1.3rem var(--disp);color:var(--tx);text-decoration:none;letter-spacing:-.02em}
.brand img{height:30px;width:auto}
.nav ul{display:flex;gap:26px;list-style:none;margin:0;padding:0}
.nav ul a{color:var(--mu);text-decoration:none;font-weight:500;font-size:.95rem}
.nav ul a:hover{color:var(--tx)}
@media(max-width:760px){.nav .wrap{flex-direction:column;height:auto;padding-top:10px;padding-bottom:10px;gap:6px;align-items:flex-start}.nav nav{width:100%;overflow-x:auto}.nav ul{display:flex;gap:18px;white-space:nowrap;padding-bottom:4px}}
section[id]{scroll-margin-top:70px}
.sec{padding:92px 0}
.sec h2{font-size:clamp(1.8rem,3.4vw,2.6rem);margin-bottom:14px}
.sec .lead{color:var(--mu);max-width:60ch}

/* hero */
.hero{padding:84px 0 70px;border-bottom:1px solid var(--line);background:radial-gradient(900px 420px at 85% 10%,rgba(47,123,255,.14),transparent 60%)}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.hero h1{font-size:clamp(2.35rem,5.2vw,4.3rem);font-weight:800;line-height:1.03;letter-spacing:-.03em;margin-bottom:22px}
.hero p{color:var(--mu);font-size:1.12rem;max-width:52ch;margin-bottom:34px}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px}
.panel-chart{border:1px solid var(--line);background:var(--s1);border-radius:16px;padding:18px 18px 10px}
.panel-chart .cap{display:flex;justify-content:space-between;color:var(--mu);font-size:.86rem;margin:0 4px 6px}
.panel-chart svg{width:100%;height:auto;display:block}
.bar{fill:color-mix(in srgb,var(--blue) 34%,transparent);transform-origin:center bottom;transform-box:fill-box}
.bar.hi{fill:color-mix(in srgb,var(--blue) 70%,transparent)}
.trend{fill:none;stroke:var(--blue2);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1}
.dot{fill:#fff;stroke:var(--blue);stroke-width:3}
.pulse{fill:none;stroke:var(--blue2);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.gl{stroke:var(--line);stroke-width:1}
.tick{fill:var(--mu);font:500 11px var(--body)}
@media(prefers-reduced-motion:no-preference){
 .bar{animation:grow .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
 .trend{animation:draw 1.9s .5s ease both}
 .dot{animation:pop .4s 2.3s ease both}
 .pulse{animation:pulse 2.4s 2.6s ease-out infinite}
}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
@media(max-width:900px){.hero .wrap{grid-template-columns:1fr;gap:40px}.hero{padding-top:48px}.sec{padding:64px 0}}
@media(max-width:560px){.hero .cta .btn,.contact .cta .btn{width:100%}.pbody{padding:18px}.pfacts div{grid-template-columns:1fr;gap:2px}.modal{padding:22px 18px}.stat b{font-size:1.8rem}}
@media(min-width:1500px){html{font-size:108%}}
@media(min-width:1900px){html{font-size:118%}}

/* about */
.about{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:64px;align-items:start}
.photo{aspect-ratio:1/1;border-radius:50%;border:3px solid var(--blue);overflow:hidden;background:var(--s1);box-shadow:0 0 0 8px rgba(47,123,255,.12)}
.photo img{width:100%;height:100%;object-fit:cover}
.mono{display:grid;place-items:center;height:100%;font:800 5rem var(--disp);color:var(--blue2);background:linear-gradient(160deg,var(--s2),var(--s1))}
.about .role{color:var(--blue2);font-weight:600;margin:6px 0 20px}
.about p{color:#C6D0E8;max-width:62ch}
.socials{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:8px}
.socials a{color:var(--mu);text-decoration:none;border-bottom:1px solid var(--line);font-size:.95rem}
.socials a:hover{color:var(--tx);border-color:var(--blue2)}
@media(max-width:800px){.about{grid-template-columns:1fr;gap:28px}.photo{max-width:260px}}

/* skills */
.skills{display:flex;flex-wrap:wrap;gap:10px;list-style:none;margin:28px 0 0;padding:0}
.skills li{padding:8px 16px;border:1px solid #243457;border-radius:999px;font-weight:500;font-size:.95rem;background:var(--s1)}

/* projects */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 30px}
.chip{padding:7px 15px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mu);font:500 .9rem var(--body);cursor:pointer}
.chip:hover{color:var(--tx);border-color:#2A3A5E}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:22px}
@media(max-width:860px){.pgrid{grid-template-columns:1fr}}
.pcard{border:1px solid var(--line);border-radius:16px;background:var(--s1);overflow:hidden;display:flex;flex-direction:column}
.pthumb{aspect-ratio:16/8;background:linear-gradient(135deg,#0c1a36,#07101f);border-bottom:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.pthumb img{width:100%;height:100%;object-fit:cover}
.pbody{padding:24px;display:flex;flex-direction:column;gap:14px;flex:1}
.pcat{color:var(--blue2);font-size:.88rem;font-weight:600}
.pcard h3{font-size:1.4rem}
.pcard .desc{color:var(--mu);margin:0}
.tools{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.tools li{font-size:.82rem;padding:3px 10px;border-radius:6px;background:rgba(47,123,255,.13);color:var(--blue2);font-weight:500}
.pfacts{display:grid;gap:10px;margin:0}
.pfacts div{display:grid;grid-template-columns:96px 1fr;gap:12px;font-size:.92rem}
.pfacts dt{color:var(--tx);font-weight:600}
.pfacts dd{margin:0;color:var(--mu);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .btn{margin-top:auto;align-self:flex-start}
.empty{border:1px dashed #2A3A5E;border-radius:14px;padding:40px;color:var(--mu);text-align:center}

/* services */
.svc{margin-top:34px;border-bottom:1px solid var(--line)}
.svc div{display:grid;grid-template-columns:minmax(200px,320px) 1fr;gap:28px;padding:24px 0;border-top:1px solid var(--line)}
.svc h3{font-size:1.25rem}
.svc p{margin:0;color:var(--mu)}
@media(max-width:700px){.svc div{grid-template-columns:1fr;gap:6px}}

/* why + contact */
.why blockquote{margin:30px 0 0;padding:6px 0 6px 28px;border-left:4px solid var(--blue);font:600 clamp(1.3rem,2.6vw,1.9rem)/1.4 var(--disp);letter-spacing:-.01em;max-width:30em}
.contact{background:var(--s1);border-top:1px solid var(--line)}
.contact .rows{margin:22px 0 30px;color:var(--mu)}
.contact .rows div{margin-bottom:4px}
.contact .rows b{color:var(--tx);font-weight:600;margin-right:8px}
.foot{padding:26px 0;border-top:1px solid var(--line);color:var(--mu);font-size:.9rem}
.banner{background:var(--blue);color:#fff;text-align:center;padding:9px 16px;font-weight:600;font-size:.92rem}
.banner a{color:#fff}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto}
.modal{background:var(--s1);border:1px solid #243457;border-radius:16px;width:100%;max-width:760px;padding:30px;position:relative}
.modal.small{max-width:440px}
.modal h3{font-size:1.6rem;margin:6px 0 12px}
.modal .x{position:absolute;right:14px;top:14px;background:transparent;border:1px solid var(--line);color:var(--mu);border-radius:8px;padding:6px 12px;cursor:pointer;font:500 .88rem var(--body)}
.modal .x:hover{color:var(--tx)}
.modal h4{font-size:1.02rem;margin:22px 0 6px;color:var(--blue2)}
.modal p{color:#C6D0E8}
.modal .links{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.modal img.hero-img{border-radius:10px;margin:14px 0;border:1px solid var(--line);width:100%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f1b33;border:1px solid var(--blue);color:var(--tx);padding:11px 18px;border-radius:10px;z-index:80;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.err{border-color:var(--bad)}

/* admin */
.adm{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.adm aside{background:var(--s1);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.adm aside .brand{margin:0 8px 20px;font-size:1.15rem}
.adm aside a.nv{display:block;padding:10px 12px;border-radius:8px;color:var(--mu);text-decoration:none;font-weight:500}
.adm aside a.nv:hover{color:var(--tx);background:var(--s2)}
.adm aside a.nv[aria-current=page]{background:rgba(47,123,255,.16);color:#fff}
.adm aside .sp{flex:1}
.adm aside button.nv{text-align:left;background:none;border:0;cursor:pointer;font:500 1rem var(--body);padding:10px 12px;color:var(--mu);border-radius:8px}
.adm aside button.nv:hover{color:var(--tx);background:var(--s2)}
.adm main{padding:28px 36px 60px;min-width:0}
.adm .top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.adm h1{font-size:1.9rem}
.adm h2{font-size:1.15rem;margin-bottom:12px}
.note{border:1px solid #2a4a86;background:rgba(47,123,255,.09);border-radius:12px;padding:14px 18px;margin-bottom:24px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note p{margin:0;color:#C6D0E8}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:28px}
.stat{border:1px solid var(--line);background:var(--s1);border-radius:12px;padding:18px}
.stat b{display:block;font:800 2.2rem var(--disp);line-height:1}
.stat span{color:var(--mu);font-size:.92rem}
.box{border:1px solid var(--line);background:var(--s1);border-radius:12px;padding:22px;margin-bottom:22px}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:22px}
@media(max-width:1000px){.two{grid-template-columns:1fr}}
.act{list-style:none;margin:0;padding:0}
.act li{padding:9px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;font-size:.94rem}
.act li:first-child{border-top:0}
.act time{color:var(--mu);white-space:nowrap;font-size:.84rem}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px 10px;border-top:1px solid var(--line);vertical-align:middle;font-size:.94rem}
th{color:var(--mu);font-weight:500;border-top:0}
td .thumb{width:64px;height:40px;border-radius:6px;object-fit:cover;background:var(--s2);border:1px solid var(--line)}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.acts button,.acts a{background:transparent;border:1px solid var(--line);color:var(--tx);border-radius:7px;padding:5px 10px;cursor:pointer;font:500 .84rem var(--body);text-decoration:none}
.acts button:hover,.acts a:hover{border-color:var(--blue2)}
.acts .del{color:var(--bad)}
.acts .del:hover{border-color:var(--bad)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:600}
.badge.pub{background:rgba(53,201,138,.14);color:var(--ok)}
.badge.dr{background:rgba(242,177,60,.14);color:var(--warn)}
.tw{overflow-x:auto}
form .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px}
form .full{grid-column:1/-1}
@media(max-width:760px){form .grid{grid-template-columns:1fr}}
label.f{display:block;font-weight:600;font-size:.92rem}
label.f small{display:block;font-weight:400;color:var(--mu);margin:2px 0 6px}
input[type=text],input[type=email],input[type=password],input[type=url],textarea,select{width:100%;margin-top:6px;background:#050a14;border:1px solid #243457;border-radius:9px;color:var(--tx);padding:11px 13px;font:400 .98rem var(--body)}
textarea{min-height:96px;resize:vertical}
input[type=color]{width:54px;height:40px;border:1px solid #243457;background:#050a14;border-radius:8px;padding:3px;margin-top:6px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--blue2);outline-offset:1px;border-color:transparent}
.imgf{display:flex;gap:16px;align-items:center;margin-top:8px}
.imgf .pv{width:96px;height:64px;border-radius:8px;border:1px solid var(--line);background:var(--s2);object-fit:cover;display:grid;place-items:center;color:var(--mu);font-size:.78rem;text-align:center;overflow:hidden}
.imgf .pv img{width:100%;height:100%;object-fit:cover}
.bar-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .box{width:100%;max-width:420px;padding:32px}
.login h1{font-size:1.7rem;margin:14px 0 8px}
.login p.mu,.mu{color:var(--mu)}
.err{color:var(--bad);min-height:1.4em;margin:10px 0 0;font-size:.92rem}
@media(max-width:860px){
 .adm{grid-template-columns:1fr}
 .adm aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}
 .adm aside .brand{width:100%;margin-bottom:6px}
 .adm aside .sp{display:none}
 .adm main{padding:22px 18px 50px}
}
</style>
<style id="themeStyle"></style>
</head>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

k":"","githubLink":"","status":"published","updated":"2026-10-05T09:00:00.000Z"},{"id":"p-churn","title":"Customer Churn Analysis","category":"Data analysis","description":"Looked at why customers stop buying and which groups are most likely to leave.","problem":"The business was losing customers but did not know which customers were leaving or why.","tools":"SQL, Python","dataset":"Sample customer records (replace with your own)","process":"Queried customer and order history with SQL, defined churn, then compared behavior of customers who stayed and customers who left using Python.","findings":"Customers with few repeat purchases in their first months were far more likely to leave.","recommendations":"Create a follow-up offer for new customers in their first few months.","outcome":"Gave the team a clear, data-backed place to focus retention efforts.","image":"","dashboardLink":"","githubLink":"","status":"published","updated":"2026-10-05T09:00:00.000Z"},{"id":"p-inventory","title":"Inventory Cleanup and Reporting","category":"Excel reporting","description":"Turned a messy stock list into a clean, automated Excel report.","problem":"The inventory sheet had duplicates, inconsistent names, and missing values, which made stock reports unreliable.","tools":"Excel","dataset":"Sample inventory list (replace with your own)","process":"Removed duplicates, standardized product names, filled gaps, then built formulas and pivot tables that update when new data is added.","findings":"Several items were counted twice, and a number of fast-moving products were repeatedly running low.","recommendations":"Set reorder levels for fast-moving items and keep one master list.","outcome":"A reliable weekly stock report that takes minutes to refresh.","image":"","dashboardLink":"","githubLink":"","status":"published","updated":"2026-10-05T09:00:00.000Z"}],"activity":[]}</script>

var enc=new TextEncoder();
var b64=function(b){return btoa(String.fromCharCode.apply(null,new Uint8Array(b)))};
var unb64=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
function derive(pw,salt){return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},k,256)})}
function setPassword(pw){var salt=crypto.getRandomValues(new Uint8Array(16));return derive(pw,salt).then(function(h){store(PW,JSON.stringify({s:b64(salt),h:b64(h)}))})}
function checkPassword(pw){var o=JSON.parse(load(PW));return derive(pw,unb64(o.s)).then(function(h){return b64(h)===o.h})}

 '<div class="box"><h2>How admin security works</h2><p class="mu" style="margin:0">The password lock keeps people out of your editing screen, and it is stored only as a scrambled hash in this browser, never in the website file. Edits change a saved copy in this browser; nothing reaches your live site until you download the updated file and upload it yourself, so visitors cannot change your public site.</p></div>');
}
function adminRoute(h){
 if(!window.crypto||!crypto.subtle){$('#app').innerHTML='<div class="login"><div class="box"><h1>Admin needs a secure page</h1><p class="mu">Open this site over https (or from a local file in a current browser) to use the admin area.</p></div></div>';return}
 if(!authed()){renderLogin();return}
 if(h==='#/admin'||h==='#/admin/')return dashboard();
 if(h==='#/admin/new')return projectForm();
 if(h.indexOf('#/admin/edit/')===0)return projectForm(decodeURIComponent(h.slice(13)));
 if(h==='#/admin/projects')return projectsList();
 if(h==='#/admin/profile')return profileForm();
 if(h==='#/admin/settings')return settingsForm();
 location.hash='#/admin';
}

/* ---------- download ---------- */
function download(){
 var w=getW();w.rev=Date.now();log('Downloaded updated file');persist();store(DIRTY,null);
 var c=document.documentElement.cloneNode(true);
 ['#app','#modalRoot','#toastRoot','#themeStyle'].forEach(function(s){c.querySelector(s).textContent=''});
 c.querySelectorAll('[data-injected]').forEach(function(n){n.remove()});
 c.querySelector('#site-data').textContent=JSON.stringify(w).replace(/</g,'\\u003c');
 c.querySelector('title').textContent=w.settings.siteName+' | '+w.profile.title;
 c.querySelector('meta[name=description]').setAttribute('content',w.settings.heroText);
 c.removeAttribute('style');
 var html='<!DOCTYPE html>\n'+c.outerHTML;
 var up=window.claude&&window.claude.use?window.claude.use('downloads'):Promise.resolve(null);
 up.then(function(d){
  if(!d){toast('Downloads are not available in this view.',true);return}
  return d.save({filename:'index.html',data:html}).then(function(){toast('Downloaded index.html. Upload it to your host to publish your changes.')}).catch(function(e){if(!e||e.code!=='declined')toast('The file could not be saved here.',true)});
 }).catch(function(){toast('Downloads are not available in this view.',true)}).then(function(){route()});
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-action]');if(!t)return;
 var a=t.getAttribute('data-action'),id=t.getAttribute('data-id');
 if(a==='close-modal'){if(t.classList.contains('ov')&&e.target!==t)return;closeModal();return}
 if(a==='open-project')return openProject(id);
 if(a==='filter'){filter=t.getAttribute('data-cat');document.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed',String(c===t))});$('#projGrid').innerHTML=projGrid(viewData);return}
 if(a==='logout'){setAuth(false);location.hash='#/';return}
 if(a==='download')return download();
 if(a==='reset-pw'){e.preventDefault();confirmBox('This removes the admin password saved in this browser so you can create a new one. Your project content is not deleted.',function(){store(PW,null);store(LOCK,null);closeModal();renderLogin()});$('#modalRoot .btn.danger').textContent='Reset password';return}
 if(a==='confirm-yes'){var f=confirmBox.yes;confirmBox.yes=null;if(f)f();return}
 if(a==='preview-project'){viewData=getW();openProject(id);return}
 if(a==='toggle-status'){var p=getW().projects.filter(function(x){return x.id===id})[0];if(!p)return;p.status=p.status==='published'?'draft':'published';p.updated=new Date().toISOString();log((p.status==='published'?'Published: ':'Unpublished: ')+p.title);persist();toast(p.status==='published'?'Published':'Unpublished');return projectsList()}
 if(a==='delete-project'){var q=getW().projects.filter(function(x){return x.id===id})[0];if(!q)return;confirmBox('Delete “'+q.title+'”? This cannot be undone.',function(){var w=getW();w.projects=w.projects.filter(function(x){return x.id!==id});log('Deleted: '+q.title);persist();closeModal();toast('Deleted');projectsList()});return}
 if(a==='clear-img'){var pa=t.getAttribute('data-path');if(pa==='form'){formImage=''}else{setPath(getW(),pa,'');log('Removed image');persist()}var pv=$('#pv-'+pa.replace(/\./g,'-'));if(pv)pv.textContent='None';return}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
document.addEventListener('change',function(e){
 var i=e.target;if(!i.matches||!i.matches('input[type=file][data-img]')||!i.files[0])return;
 var path=i.getAttribute('data-img'),logo=path==='settings.logo';
 img(i.files[0],logo?400:path==='profile.photo'?900:1000,logo?'image/png':'image/jpeg').then(function(d){
  if(path==='form')formImage=d;else{setPath(getW(),path,d);log('Updated '+(logo?'logo':'profile photo'));persist()}
  var pv=$('#pv-'+path.replace(/\./g,'-'));if(pv)pv.innerHTML='<img src="'+d+'" alt="">';
 }).catch(function(){toast('That image could not be read. Try a JPG or PNG.',true)});
});
document.addEventListener('submit',function(e){
 var f=e.target,k=f.getAttribute('data-form');if(!k)return;e.preventDefault();
 var er=$('#lerr')||$('#ferr');
 if(k==='setup'){var n1=f.pw.value,n2=f.pw2.value;if(n1.length<8){er.textContent='Use at least 8 characters.';return}if(n1!==n2){er.textContent='The two passwords do not match.';return}
  setPassword(n1).then(function(){setAuth(true);location.hash='#/admin';route()});return}
 if(k==='login'){var left=lockLeft();if(left){er.textContent='Too many attempts. Try again in '+left+' seconds.';return}
  checkPassword(f.pw.value).then(function(ok){if(ok){fails=0;setAuth(true);location.hash='#/admin';route()}else{fails++;if(fails>=5){store(LOCK,String(Date.now()+30000));fails=0;er.textContent='Too many attempts. Try again in 30 seconds.'}else er.textContent='That password is not correct.'}});return}
 if(!authed()){renderLogin();return}
 if(k==='chpw'){var pe=$('#perr');if(!f.cur.value||f.n1.value.length<8){pe.textContent='Enter your current password and a new one with at least 8 characters.';return}if(f.n1.value!==f.n2.value){pe.textContent='The new passwords do not match.';return}
  checkPassword(f.cur.value).then(function(ok){if(!ok){pe.textContent='Your current password is not correct.';return}return setPassword(f.n1.value).then(function(){f.reset();pe.textContent='';toast('Password updated')})});return}
 var w=getW();
 if(k==='profile'||k==='settings'){
  var els=f.querySelectorAll('[name*="."]');
  if(k==='settings'&&!f.elements['settings.siteName'].value.trim()){er.textContent='Enter a portfolio name.';return}
  var au=f.elements['settings.analyticsUrl']?f.elements['settings.analyticsUrl'].value.trim():'';
  if(au&&!/^https:\/\/[a-z0-9-]+\.goatcounter\.com\/count$/i.test(au)){er.textContent='The GoatCounter address should look like https://yourname.goatcounter.com/count';return}
  for(var i=0;i<els.length;i++){var el=els[i],v=el.value;
   if(el.getAttribute('data-type')==='lines')v=v.split('\n').map(function(s){return s.trim()}).filter(Boolean);
   else if(el.type==='url'||el.type==='email'||el.type==='text'||el.tagName==='TEXTAREA')v=v.trim();
   setPath(w,el.name,v)}
  log(k==='profile'?'Updated profile':'Updated website settings');
  if(persist())toast('Saved');k==='profile'?profileForm():settingsForm();return}
 if(k==='project'){
  var d=new FormData(f),st=e.submitter?e.submitter.getAttribute('data-status'):'draft',pid=f.getAttribute('data-id');
  var title=String(d.get('title')||'').trim();if(!title){er.textContent='Give the project a title.';return}
  var o={title:title,category:'',description:'',problem:'',tools:'',dataset:'',process:'',findings:'',recommendations:'',outcome:'',dashboardLink:'',githubLink:''};
  Object.keys(o).forEach(function(n){if(n!=='title')o[n]=String(d.get(n)||'').trim()});
  ['dashboardLink','githubLink'].forEach(function(n){if(o[n]&&!safeUrl(o[n])){er.textContent='Links must start with https:// or http://';o.bad=1}});if(o.bad)return;
  o.image=formImage;o.status=st;o.updated=new Date().toISOString();
  if(pid){var ex=w.projects.filter(function(x){return x.id===pid})[0];o.id=pid;w.projects[w.projects.indexOf(ex)]=o}else{o.id='p'+Date.now().toString(36);w.projects.unshift(o)}
  log((pid?'Edited: ':'Added: ')+title+(st==='draft'?' (draft)':''));
  if(persist()){toast(st==='published'?'Published':'Saved as draft');location.hash='#/admin/projects'}return}
});

/* ---------- router ---------- */
function route(){
 var h=location.hash||'#/';
 closeModal();
 if(h.indexOf('#/admin')===0)return adminRoute(h);
 if(h==='#/preview'){if(!authed()){location.hash='#/admin';return}return renderPublic(getW(),true)}
 if(h.charAt(1)!=='/'&&h.length>1&&(view==='public'||view==='preview'))return;
 renderPublic(baseData,false);
 if(h.charAt(1)!=='/'&&h.length>1){var el=document.getElementById(h.slice(1));if(el)el.scrollIntoView()}
}
window.addEventListener('hashchange',route);
route();
})();
</script>
